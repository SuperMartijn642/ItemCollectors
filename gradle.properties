# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft
minecraft_version=26.1.2
minecraft_dependency=>=26.1 <26.2
minecraft_suffix=mc26.1
java_target=25
java_dependency=>=25

# Fabric
